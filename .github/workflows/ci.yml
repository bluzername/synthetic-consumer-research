name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies (locked)
        run: uv sync --locked

      - name: Run tests
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY || 'sk-or-v1-dummy-key-for-testing' }}
        run: uv run pytest tests/ -v --tb=short

      - name: Check imports
        run: uv run python -c "from src.utils import ProductConcept, Persona, get_config; print('Imports successful')"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.13
      - name: Check Python syntax
        run: uv run --no-project --python 3.13 python -m compileall -q src tests

  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required files and directories
        run: |
          for f in README.md LICENSE CONTRIBUTING.md CHANGELOG.md pyproject.toml uv.lock config/settings.yaml config/prompts.yaml docs/README.md docs/SETUP.md docs/METHODOLOGY.md docs/ETHICS.md; do
            test -f "$f" || { echo "missing $f"; exit 1; }
          done
          for d in src/agents src/utils src/orchestration src/visualization src/post_composer tests docs config; do
            test -d "$d" || { echo "missing $d"; exit 1; }
          done
          echo "Structure valid"
